<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram-бот — перейти</title>
  <meta name="description" content="Кнопка переходу в Telegram-бот">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --plate-a: #101b31;
      --plate-b: #1f2c47;
      --word: #dfe7f2;
      --word-faint: #7386a0;
      --foot-link: #a9bacf;
      --foot-link-hot: #dfe7f2;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --plate-a: #fcfdfe;
        --plate-b: #e4e9ef;
        --word: #24395a;
        --word-faint: #7386a0;
        --foot-link: #5f7692;
        --foot-link-hot: #142238;
      }
    }

    html { height: 100%; background: var(--plate-b); }
    body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--plate-a) 0%, var(--plate-b) 100%);
      color: var(--word);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      width: 100%;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(180deg, #45b1e8 0%, #208dc0 100%);
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      padding: 19px 42px;
      border-radius: 50px;
      box-shadow: 0 15px 36px rgba(32, 141, 192, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 19px 44px rgba(32, 141, 192, 0.56);
    }

    .cta-btn:active { transform: translateY(-1px); }

    .cta-btn svg { width: 29px; height: 29px; fill: #fff; flex-shrink: 0; }

    .site-foot {
      padding: 24px 16px;
      padding-bottom: calc(36px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 13px;
      color: var(--word-faint);
      width: 100%;
    }

    .site-foot a {
      color: var(--foot-link);
      text-decoration: none;
      margin: 0 6px;
      white-space: nowrap;
    }

    .site-foot a:hover { color: var(--foot-link-hot); text-decoration: underline; }

    .site-foot .bar { margin: 0 6px; }

    @media (max-width: 520px) {
      .cta-btn {
        font-size: 18px;
        padding: 16px 28px;
        gap: 10px;
        max-width: 100%;
      }
      .cta-btn svg { width: 25px; height: 25px; }
      .site-foot { padding: 20px 14px calc(20px + env(safe-area-inset-bottom)); }
      .site-foot a { display: block; margin: 10px 0; }
      .site-foot .bar { display: none; }
    }
  </style>

  <script>
    const readParam = (key) => new URLSearchParams(window.location.search).get(key);

    const pixelToken = readParam("pixel");

    if (pixelToken) {
      const loadPixel = function (win, doc) {
        if (win.fbq) return;
        const api = (win.fbq = function () {
          api.callMethod
            ? api.callMethod.apply(api, arguments)
            : api.queue.push(arguments);
        });
        if (!win._fbq) win._fbq = api;
        api.push = api;
        api.loaded = true;
        api.version = "2.0";
        api.queue = [];
        const tag = doc.createElement("script");
        tag.async = true;
        tag.src = "https://connect.facebook.net/en_US/fbevents.js";
        doc.head.append(tag);
      };
      loadPixel(window, document);

      fbq("init", pixelToken);
      fbq("track", "PageView");
    }

    const openBotAfterLead = function (botUrl) {
      if (!window.fbq) return true;
      fbq("track", "Lead");
      setTimeout(() => { window.location.href = botUrl; }, 320);
      return false;
    };
  </script>
</head>
<body>
  <main>
    <a class="cta-btn" href="tg://resolve?domain=GROSHl_now_bot" onclick="return openBotAfterLead(this.href)">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 12.86 3.64 11.6c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
      </svg>
      Відкрити Telegram бота
    </a>
  </main>

  <footer class="site-foot">
    <a href="privacy-notice.html">Приватність</a><span class="bar">·</span><a href="cookie-notice.html">Cookie-файли</a><span class="bar">·</span><a href="user-terms.html">Умови</a>
  </footer>
</body>
</html>
